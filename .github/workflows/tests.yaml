name: Tests
on:
  pull_request:
    paths-ignore:
      # - docs/**
      - README.md
  push:
    branches:
      - master
    paths-ignore:
      # - docs/**
      - README.md
jobs:
  tests:
    name: ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.15" }
          - { python: "3.14" }
          - { python: "3.13" }
          - { python: "3.12" }
          - { python: "3.11" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install tox
      - run: tox -e "py$(echo '${{ matrix.python }}' | tr -d '.')"
